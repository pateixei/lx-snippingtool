[workspace]
resolver = "2"
members = ["crates/lx-snip-core", "crates/lx-snippingtool"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["lx-snippingtool contributors"]
description = "Windows 11 Snipping Tool clone for Linux and Windows desktops"

[workspace.dependencies]
lx-snip-core = { path = "crates/lx-snip-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tiny-skia = "0.11"
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
ashpd = "0.10"
pipewire = "0.8"
zbus = "5"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
x11rb = { version = "0.13", features = ["shm", "randr", "xfixes"] }
wl-clipboard-rs = "0.9"
ksni = { version = "0.3", features = ["blocking"] }
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "canvas", "image", "svg", "tokio", "multi-window"] }
iced_layershell = "0.12"
directories = "5"
libc = "0.2"
windows = { version = "0.52", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
